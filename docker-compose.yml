services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # LLM
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}

      # RAG
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-monc_rag}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-mpnet-base-v2}
      EMBED_CACHE_PATH: ${EMBED_CACHE_PATH:-/app/embed_cache.sqlite}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.25}

      # Event logging -> Qdrant
      LOG_EVENTS_TO_QDRANT: "true"
      QDRANT_EVENT_COLLECTION: monc_chat_logs
      QDRANT_EVENT_AUTOCREATE: "true"

      OPENAI_COMPAT_BASE_URL: http://host.docker.internal:8080/v1

      # DB (postgres) for /events endpoint etc.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/mcp
      REQUIRE_DB: "true"
      DB_INIT_RETRIES: ${DB_INIT_RETRIES:-30}
      DB_INIT_SLEEP_S: ${DB_INIT_SLEEP_S:-1.0}

    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
      qdrant-init:
        condition: service_completed_successfully

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped

  qdrant-init:
    image: curlimages/curl:8.6.0
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: monc_rag
      QDRANT_EVENT_COLLECTION: monc_chat_logs
      EMBED_DIM: "768"
    entrypoint:
      - sh
      - -lc
      - |
        set -e

        echo "Waiting for Qdrant at $$QDRANT_URL ..."
        for i in $$(seq 1 60); do
          if curl -fsS "$$QDRANT_URL/collections" >/dev/null; then
            echo "Qdrant is up."
            break
          fi
          sleep 1
        done

        echo "Create RAG collection: $$QDRANT_COLLECTION"
        curl -fsS -X PUT "$$QDRANT_URL/collections/$$QDRANT_COLLECTION" \
          -H "Content-Type: application/json" \
          -d "{\"vectors\":{\"size\":$$EMBED_DIM,\"distance\":\"Cosine\"}}" >/dev/null || true

        echo "Create event collection: $$QDRANT_EVENT_COLLECTION"
        curl -fsS -X PUT "$$QDRANT_URL/collections/$$QDRANT_EVENT_COLLECTION" \
          -H "Content-Type: application/json" \
          -d "{\"vectors\":{\"size\":$$EMBED_DIM,\"distance\":\"Cosine\"}}" >/dev/null || true

        echo "Done."
    restart: "no"



  ollama:
    image: ollama/ollama:0.13.4
    ports:
      - "11433:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.13.4
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - ollama:/root/.ollama
    entrypoint:
      - sh
      - -lc
      - |
        set -e
        echo "Waiting for Ollama..."
        i=0
        until ollama list >/dev/null 2>&1; do
          i=$$((i+1))
          if [ "$$i" -gt 120 ]; then
            echo "Ollama not responding in time" >&2
            exit 1
          fi
          sleep 1
        done
        echo "Pulling model: $$OLLAMA_MODEL"
        ollama pull "$$OLLAMA_MODEL"
        echo "Done."
    restart: "no"

  # Run only when you want to seed (does not block API)
  rag-seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-monc_rag}
      EMBED_DIM: ${EMBED_DIM:-768}
      EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-mpnet-base-v2}
      EMBED_CACHE_PATH: ${EMBED_CACHE_PATH:-/app/embed_cache.sqlite}
    volumes:
      - ./:/app
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.rag.seed_fastfinance"]
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: mcp
    ports:
      - "5434:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcp"]
      interval: 3s
      timeout: 3s
      retries: 30

  ui:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      API_URL: http://api:8000
    command: sh -lc "pip install -r requirements.txt && streamlit run app/ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501"
    ports:
      - "8501:8501"
    depends_on:
      - api

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://ui:8501
    depends_on:
      - ui
    restart: unless-stopped

volumes:
  ollama:
  pg:
  qdrant:
